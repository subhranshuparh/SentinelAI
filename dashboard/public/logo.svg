<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" role="img" aria-label="SentinelAI Logo">
  <defs>
    <!-- Shield gradient: dark navy to rich blue -->
    <linearGradient id="shieldGrad" x1="100" y1="10" x2="100" y2="185" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a6e"/>
      <stop offset="50%" stop-color="#0f1f4a"/>
      <stop offset="100%" stop-color="#080f2a"/>
    </linearGradient>
    <!-- Shield border gradient -->
    <linearGradient id="borderGrad" x1="20" y1="10" x2="180" y2="185" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4a90e2"/>
      <stop offset="40%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <!-- S letterform gradient -->
    <linearGradient id="sGrad" x1="80" y1="60" x2="130" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#c8d8f0"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="eyeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Hexagon pattern -->
    <pattern id="hexPattern" x="0" y="0" width="18" height="20" patternUnits="userSpaceOnUse" patternTransform="translate(100,100)">
      <polygon points="9,1 17,5.5 17,14.5 9,19 1,14.5 1,5.5" fill="none" stroke="#1a3a6a" stroke-width="0.6" opacity="0.5"/>
    </pattern>
    <!-- Clip for shield shape -->
    <clipPath id="shieldClip">
      <path d="M100 12 L170 38 L170 100 Q170 155 100 185 Q30 155 30 100 L30 38 Z"/>
    </clipPath>
  </defs>

  <!-- Shield outer border / glow layer -->
  <path d="M100 8 L176 36 L176 100 Q176 160 100 192 Q24 160 24 100 L24 36 Z"
        fill="none" stroke="url(#borderGrad)" stroke-width="3" opacity="0.7" filter="url(#glow)"/>

  <!-- Shield body fill -->
  <path d="M100 12 L172 39 L172 100 Q172 157 100 188 Q28 157 28 100 L28 39 Z"
        fill="url(#shieldGrad)"/>

  <!-- Hexagon texture on right half -->
  <g clip-path="url(#shieldClip)">
    <rect x="100" y="0" width="80" height="200" fill="url(#hexPattern)"/>
  </g>

  <!-- Shield inner border line -->
  <path d="M100 16 L168 42 L168 100 Q168 154 100 184 Q32 154 32 100 L32 42 Z"
        fill="none" stroke="#2a5298" stroke-width="1.5" opacity="0.6"/>

  <!-- Circuit traces — left side -->
  <g stroke="#38bdf8" stroke-width="1.2" opacity="0.85" stroke-linecap="round" fill="none">
    <!-- Main vertical trace -->
    <line x1="52" y1="50" x2="52" y2="120"/>
    <!-- Horizontal branches -->
    <line x1="52" y1="65" x2="68" y2="65"/>
    <line x1="52" y1="80" x2="62" y2="80"/>
    <line x1="52" y1="100" x2="70" y2="100"/>
    <!-- Node dots -->
    <circle cx="52" cy="65" r="2.5" fill="#38bdf8"/>
    <circle cx="52" cy="80" r="2" fill="#38bdf8"/>
    <circle cx="52" cy="100" r="2.5" fill="#60a5fa"/>
    <circle cx="68" cy="65" r="2" fill="#38bdf8"/>
    <!-- Short angled connector -->
    <line x1="62" y1="80" x2="62" y2="90"/>
    <circle cx="62" cy="90" r="1.8" fill="#38bdf8"/>
  </g>

  <!-- S letterform -->
  <text x="100" y="138"
        font-family="Arial Black, Arial, sans-serif"
        font-size="90"
        font-weight="900"
        fill="url(#sGrad)"
        text-anchor="middle"
        dominant-baseline="middle"
        filter="url(#glow)"
        letter-spacing="-2"
        transform="translate(0,-2)">S</text>

  <!-- S letterform subtle shadow/depth -->
  <text x="102" y="140"
        font-family="Arial Black, Arial, sans-serif"
        font-size="90"
        font-weight="900"
        fill="#1a3a6e"
        text-anchor="middle"
        dominant-baseline="middle"
        opacity="0.4"
        letter-spacing="-2">S</text>

  <!-- Eye icon — top right area -->
  <g transform="translate(145, 52)" filter="url(#eyeGlow)">
    <!-- Eye outline -->
    <path d="M-14,0 Q0,-9 14,0 Q0,9 -14,0 Z" fill="#0f1f4a" stroke="#60a5fa" stroke-width="1.2"/>
    <!-- Iris -->
    <circle cx="0" cy="0" r="5" fill="#1e3a8a"/>
    <!-- Pupil highlight -->
    <circle cx="0" cy="0" r="3" fill="#60a5fa"/>
    <circle cx="1.5" cy="-1.5" r="1" fill="#bfdbfe" opacity="0.9"/>
  </g>

  <!-- Lock icon — bottom center -->
  <g transform="translate(100, 162)" filter="url(#glow)">
    <!-- Lock body -->
    <rect x="-10" y="-2" width="20" height="16" rx="3" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.3"/>
    <!-- Lock shackle -->
    <path d="M-6,-2 L-6,-9 Q-6,-16 0,-16 Q6,-16 6,-9 L6,-2" fill="none" stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Keyhole -->
    <circle cx="0" cy="6" r="3" fill="#60a5fa"/>
    <rect x="-1.5" y="7" width="3" height="4" rx="1" fill="#60a5fa"/>
  </g>

  <!-- Shield top center highlight reflection -->
  <path d="M100 15 L145 34 L145 55 Q145 58 100 68 Q55 58 55 55 L55 34 Z"
        fill="white" opacity="0.04"/>
</svg>
