<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Dark before first paint. Without this the browser flashes a white page
         while React boots, which on a projector is genuinely unpleasant. -->
    <meta name="color-scheme" content="dark" />
    <title>SentinelAI — Security Dashboard</title>

    <!-- SEO -->
    <meta name="description" content="SentinelAI — Your AI-powered cybersecurity copilot. Privacy protection, identity monitoring, and safe browsing in one unified dashboard." />
    <meta name="theme-color" content="#0b0f16" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SentinelAI — Security Dashboard" />
    <meta property="og:description" content="Privacy. Protection. Peace of Mind. Your AI cybersecurity copilot." />
    <meta property="og:image" content="/logo.svg" />

    <!-- Google Fonts: Inter — modern, highly readable, premium feel -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      html,
      body {
        margin: 0;
        background: #0b0f16;
        font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
