[phases.setup]
nixPkgs = ["nodejs_20", "python311", "python311Packages.pip"]

[phases.install]
cmds = [
  "python3 -m pip install --no-cache-dir -r backend/requirements.txt",
  "npm install --prefix dashboard"
]

[phases.build]
cmds = [
  "npm run build --prefix dashboard"
]

[start]
cmd = "bash start.sh"
